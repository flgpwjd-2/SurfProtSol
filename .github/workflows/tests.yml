name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Check release manifest freshness
        run: |
          python scripts/build_release_manifest.py
          git diff --exit-code -- RELEASE_MANIFEST.csv RELEASE_MANIFEST_SUMMARY.json
      - name: Audit release contents
        run: python scripts/audit_public_repo.py
      - name: Install
        run: python -m pip install .
      - name: Run synthetic tests
        run: python -m unittest discover -s tests -v
      - name: Check package version and command-line entry points
        run: |
          python -c "import surfprotsol; assert surfprotsol.__version__ == '1.0.1'"
          surfprotsol-train --help
          surfprotsol-evaluate --help
