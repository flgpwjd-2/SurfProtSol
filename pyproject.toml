[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surfprotsol"
version = "1.0.1"
description = "Clean reference implementation of surface-aware multimodal protein solubility prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Huijing Lee"}
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "scikit-learn>=1.3",
  "torch>=1.12"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "ruff>=0.4"
]

[project.scripts]
surfprotsol-train = "surfprotsol.train:main"
surfprotsol-evaluate = "surfprotsol.evaluate:main"

[tool.setuptools.packages.find]
include = ["surfprotsol*"]

[tool.ruff]
line-length = 100
target-version = "py310"
